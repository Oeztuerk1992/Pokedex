<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="icon" type="image/x-icon" href="./logo/logo.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./style/colors.css">
    <link rel="stylesheet" href="./style/spinner.css">
    <link rel="stylesheet" href="./style/responsive.css">
    <link rel="stylesheet" href="./style/sidebar.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=menu" />
</head>
<body onload="fetchPokemonData()">
<header>
    <nav class="navbar">
        <a href="./index.html"><img class="pokemonBackground1" src="./logo/logo1.png" alt=""></a>
            <div class="container-width container-fluid">
                 <div class="navbar-brand logo">
                    <a href="./index.html"><img class="logo" src="./logo/logo.png" alt="logo"></a>
                    <span class="logo-text">Pokédex</span>
                </div>
                <div class="menu-container">
                    <span onclick="showSidebar()" class="material-symbols-outlined menu-sidebar">menu</span>
                </div>
                <div class="d-flex d-md-flex search-container" role="search">
                    <input id="searchInput" class="form-control me-2" oninput="searchReset()" type="search" placeholder="Search" aria-label="Search"/>
                    <button onclick="searchDesktop()" class="btn border-white text-white" type="button">Search</button>
                </div>
                <div id="mySidebar" class="sidebar" role="search">
                    <span class="close close-btn" onclick="closeMenu()">&times;</span>
                    <input id="searchInputMobile" class="form-control me-2" oninput="searchReset()" type="search" placeholder="Search" aria-label="Search" />
                    <button onclick="searchMobile()" class="btn border-white text-white" type="button">Search</button> 
                </div>
            </div>     
    </nav> 
</header>
<div class="main-container  container-width">
    <div id="pokemon-container" class="pokemon-container contain-box"></div>
    <div class="spinner-container hidden">
    <div class="spinner"></div>
</div>
    <div class="text-center">
        <button onclick="loadedMorePokemons()" class="btn btn-success" id="load-more">Load More</button>
    </div>
</div>
<footer>
    <div class="foot text-white py-3">
        <p>© 2026 Pokédex.</p>
    </div>
</footer>
<div class="overlay hidden" onclick="closeModal()"></div>
<div class="modal hidden"></div>
<script src="./scripts/menu.js"></script>
<script src="./scripts/template.js"></script>
<script src="./script.js"></script>
</body>
</html>
